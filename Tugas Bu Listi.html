<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetStore Management System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f6fb;
    color: #1f2937;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #111827, #2563eb);
    color: white;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 8px;
    opacity: .9;
}

/* NAVIGATION */
nav {
    background: white;
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

nav button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #e5e7eb;
    font-weight: bold;
}

nav button:hover,
nav button.active {
    background: #2563eb;
    color: white;
}

/* CONTAINER */
.container {
    width: 94%;
    max-width: 1200px;
    margin: 25px auto;
}

.section {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.section h2 {
    margin-bottom: 20px;
}

/* ADMIN */
.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.primary {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary:hover {
    background: #1d4ed8;
}

/* PRODUCT GRID */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    overflow: hidden;
    background: white;
    transition: .3s;
}

.product:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
}

.product-img {
    width: 100%;
    height: 210px;
    object-fit: cover;
    cursor: pointer;
}

.product-content {
    padding: 16px;
}

.product h3 {
    margin-bottom: 8px;
}

.price {
    color: #2563eb;
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0;
}

.desc {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
}

.product-buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.product-buttons button {
    flex: 1;
    padding: 10px 5px;
    border-radius: 7px;
    cursor: pointer;
    border: none;
    font-weight: bold;
}

.cart-btn {
    background: #facc15;
}

.buy-btn {
    background: #16a34a;
    color: white;
}

/* CART */
.cart-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.cart-item img {
    width: 80px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
}

.cart-info {
    flex: 1;
}

.remove {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.total {
    text-align: right;
    font-size: 21px;
    font-weight: bold;
    margin: 20px 0;
}

/* CHECKOUT */
.checkout-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.payment-option {
    display: block;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.payment-option:hover {
    background: #eff6ff;
    border-color: #2563eb;
}

.payment-option input {
    width: auto;
    margin-right: 10px;
}

/* STATUS */
.status-card {
    border-left: 6px solid #2563eb;
    background: #eff6ff;
    padding: 20px;
    border-radius: 10px;
}

.progress {
    display: flex;
    justify-content: space-between;
    margin: 30px 0;
    position: relative;
}

.progress::before {
    content: "";
    position: absolute;
    top: 18px;
    left: 5%;
    right: 5%;
    height: 5px;
    background: #d1d5db;
    z-index: 0;
}

.step {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 20%;
}

.circle {
    width: 38px;
    height: 38px;
    margin: auto;
    border-radius: 50%;
    background: #d1d5db;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
}

.step.active .circle {
    background: #2563eb;
}

.step p {
    margin-top: 8px;
    font-size: 12px;
}

.hidden {
    display: none;
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 500px;
    padding: 25px;
    border-radius: 15px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 10px;
}

.close {
    float: right;
    font-size: 25px;
    cursor: pointer;
}

.video-box {
    margin-top: 15px;
}

video {
    width: 100%;
    border-radius: 10px;
}

/* RESPONSIVE */
@media(max-width:700px) {
    .checkout-box {
        grid-template-columns: 1fr;
    }

    .progress p {
        font-size: 9px;
    }

    .cart-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛒 GadgetStore Management System</h1>
    <p>Platform E-Commerce Gadget Modern</p>
</header>

<nav>
    <button class="active" onclick="showPage('produk', this)">🏠 Produk</button>
    <button onclick="showPage('admin', this)">⚙️ Admin</button>
    <button onclick="showPage('keranjang', this)">🛒 Keranjang (<span id="cartCount">0</span>)</button>
    <button onclick="showPage('pesanan', this)">📦 Pesanan</button>
</nav>

<div class="container">

<!-- PRODUK -->
<section id="produk" class="section">
    <h2>📱 Katalog Produk</h2>

    <div class="product-grid" id="productGrid"></div>
</section>


<!-- ADMIN -->
<section id="admin" class="section hidden">
    <h2>⚙️ Panel Administrator</h2>

    <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" id="namaProduk" placeholder="Contoh: Smartphone Pro Max">
    </div>

    <div class="form-group">
        <label>Deskripsi & Harga</label>
        <textarea id="deskripsiProduk"
        placeholder="Contoh: RAM 12GB, Storage 256GB, Rp 12.000.000"></textarea>
    </div>

    <div class="form-group">
        <label>URL Gambar Produk</label>
        <input type="text" id="gambarProduk"
        placeholder="Masukkan URL gambar">
    </div>

    <button class="primary" onclick="tambahProduk()">
        💾 Simpan Produk ke Database
    </button>
</section>


<!-- KERANJANG -->
<section id="keranjang" class="section hidden">
    <h2>🛒 Keranjang Belanja</h2>

    <div id="cartList"></div>

    <div class="total">
        Total: <span id="cartTotal">Rp 0</span>
    </div>

    <button class="primary" onclick="checkout()">
        💳 Lanjut ke Pembayaran
    </button>
</section>


<!-- CHECKOUT -->
<section id="checkoutPage" class="section hidden">

    <h2>💳 Checkout & Pembayaran</h2>

    <div class="checkout-box">

        <div>
            <h3>📍 Alamat Pengiriman</h3>
            <br>

            <div class="form-group">
                <label>Nama Penerima</label>
                <input id="namaPenerima" placeholder="Nama lengkap">
            </div>

            <div class="form-group">
                <label>Nomor Telepon</label>
                <input id="telepon" placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group">
                <label>Alamat Lengkap</label>
                <textarea id="alamat"
                placeholder="Jalan, nomor rumah, kecamatan, kota"></textarea>
            </div>
        </div>

        <div>
            <h3>💰 Metode Pembayaran</h3>
            <br>

            <label class="payment-option">
                <input type="radio" name="payment" value="Transfer Bank">
                🏦 Transfer Bank
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="E-Wallet">
                📱 E-Wallet (DANA / OVO / GoPay)
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="QRIS">
                🔳 QRIS
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="COD">
                🚚 COD (Bayar di Tempat)
            </label>

            <br>

            <button class="primary" onclick="buatPesanan()">
                ✅ Buat Pesanan
            </button>
        </div>

    </div>
</section>


<!-- PESANAN -->
<section id="pesanan" class="section hidden">

    <h2>📦 Status Pesanan</h2>

    <div id="orderContent">
        <p>Belum ada pesanan.</p>
    </div>

</section>

</div>


<!-- MODAL DETAIL PRODUK -->
<div class="modal" id="productModal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <img id="modalImage">

        <br><br>

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalDesc"></p>

        <div class="video-box">
            <h3>🎬 Video Demo Produk</h3>

            <video controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4">
            </video>
        </div>

        <br>

        <button class="primary" id="modalCart">
            🛒 Tambahkan ke Keranjang
        </button>

        <button class="primary" id="modalBuy"
        style="background:#16a34a;">
            ⚡ Beli Sekarang
        </button>

    </div>
</div>


<script>

/* DATA PRODUK */
let products = [

{
    id: 1,
    name: "Smartphone Premium",
    price: 12000000,
    desc: "RAM 12GB • Storage 256GB • Kamera 200MP • Layar AMOLED",
    image: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=800"
},

{
    id: 2,
    name: "Laptop Ultra Pro",
    price: 18500000,
    desc: "Intel Core i7 • RAM 16GB • SSD 1TB • Layar 14 Inch",
    image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800"
},

{
    id: 3,
    name: "Smartwatch X",
    price: 2500000,
    desc: "AMOLED • GPS • Heart Rate • Waterproof",
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"
},

{
    id: 4,
    name: "Wireless Headphone",
    price: 1750000,
    desc: "Noise Cancelling • Bluetooth 5.3 • Battery 40 Jam",
    image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800"
},

{
    id: 5,
    name: "Tablet Pro",
    price: 8500000,
    desc: "Layar 12.9 Inch • RAM 8GB • Storage 256GB",
    image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=800"
},

{
    id: 6,
    name: "Gaming Smartphone",
    price: 10500000,
    desc: "RAM 16GB • Snapdragon • AMOLED 144Hz • Gaming Mode",
    image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800"
}

];

let cart = [];
let currentProduct = null;
let order = null;


/* FORMAT RUPIAH */
function rupiah(number) {
    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(number);
}


/* TAMPIL PRODUK */
function renderProducts() {

    const grid = document.getElementById("productGrid");

    grid.innerHTML = "";

    products.forEach(product => {

        grid.innerHTML += `

        <div class="product">

            <img
                class="product-img"
                src="${product.image}"
                onclick="showDetail(${product.id})"
            >

            <div class="product-content">

                <h3>${product.name}</h3>

                <div class="price">
                    ${rupiah(product.price)}
                </div>

                <p class="desc">
                    ${product.desc}
                </p>

                <div class="product-buttons">

                    <button class="cart-btn"
                    onclick="addToCart(${product.id})">
                        🛒 Keranjang
                    </button>

                    <button class="buy-btn"
                    onclick="buyNow(${product.id})">
                        ⚡ Beli
                    </button>

                </div>

            </div>

        </div>

        `;
    });
}


/* DETAIL PRODUK */
function showDetail(id) {

    const product = products.find(p => p.id === id);

    currentProduct = product;

    document.getElementById("modalImage").src = product.image;
    document.getElementById("modalName").innerText = product.name;
    document.getElementById("modalPrice").innerText = rupiah(product.price);
    document.getElementById("modalDesc").innerText = product.desc;

    document.getElementById("modalCart").onclick =
        () => addToCart(product.id);

    document.getElementById("modalBuy").onclick =
        () => buyNow(product.id);

    document.getElementById("productModal").style.display = "flex";
}


function closeModal() {
    document.getElementById("productModal").style.display = "none";
}


/* KERANJANG */
function addToCart(id) {

    const product = products.find(p => p.id === id);

    cart.push(product);

    updateCart();

    closeModal();

    alert(product.name + " berhasil dimasukkan ke keranjang 🛒");
}


function updateCart() {

    document.getElementById("cartCount").innerText = cart.length;

    const list = document.getElementById("cartList");

    if (cart.length === 0) {

        list.innerHTML = "<p>Keranjang masih kosong.</p>";

    } else {

        list.innerHTML = "";

        cart.forEach((item, index) => {

            list.innerHTML += `

            <div class="cart-item">

                <img src="${item.image}">

                <div class="cart-info">

                    <b>${item.name}</b>

                    <p>${rupiah(item.price)}</p>

                </div>

                <button class="remove"
                onclick="removeCart(${index})">
                    Hapus
                </button>

            </div>

            `;
        });
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price, 0
    );

    document.getElementById("cartTotal").innerText = rupiah(total);
}


function removeCart(index) {

    cart.splice(index, 1);

    updateCart();
}


/* BELI LANGSUNG */
function buyNow(id) {

    const product = products.find(p => p.id === id);

    cart = [product];

    updateCart();

    closeModal();

    showPage("checkoutPage");

    document.querySelectorAll("nav button")
    .forEach(btn => btn.classList.remove("active"));
}


/* CHECKOUT */
function checkout() {

    if (cart.length === 0) {
        alert("Keranjang masih kosong!");
        return;
    }

    showPage("checkoutPage");
}


/* BUAT PESANAN */
function buatPesanan() {

    const nama = document.getElementById("namaPenerima").value;
    const telepon = document.getElementById("telepon").value;
    const alamat = document.getElementById("alamat").value;

    const payment =
        document.querySelector('input[name="payment"]:checked');

    if (!nama || !telepon || !alamat || !payment) {

        alert("Lengkapi alamat dan pilih metode pembayaran!");

        return;
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price, 0
    );

    order = {

        id: "GS-" + Math.floor(Math.random() * 90000 + 10000),

        nama: nama,

        telepon: telepon,

        alamat: alamat,

        payment: payment.value,

        total: total,

        items: [...cart]

    };

    cart = [];

    updateCart();

    tampilkanPesanan();

    showPage("pesanan");

    alert("🎉 Pesanan berhasil dibuat!");
}


/* STATUS PESANAN */
function tampilkanPesanan() {

    if (!order) return;

    document.getElementById("orderContent").innerHTML = `

        <div class="status-card">

            <h3>Pesanan #${order.id}</h3>

            <br>

            <p><b>Nama:</b> ${order.nama}</p>

            <p><b>Telepon:</b> ${order.telepon}</p>

            <p><b>Alamat:</b> ${order.alamat}</p>

            <p><b>Pembayaran:</b> ${order.payment}</p>

            <p><b>Total:</b> ${rupiah(order.total)}</p>

            <br>

            <h3>🚚 Status: Menunggu diantar ke alamat</h3>

        </div>


        <div class="progress">

            <div class="step active">
                <div class="circle">✓</div>
                <p>Dipesan</p>
            </div>

            <div class="step active">
                <div class="circle">✓</div>
                <p>Dibayar</p>
            </div>

            <div class="step active">
                <div class="circle">✓</div>
                <p>Dikemas</p>
            </div>

            <div class="step active">
                <div class="circle">🚚</div>
                <p>Dikirim</p>
            </div>

            <div class="step">
                <div class="circle">✓</div>
                <p>Selesai</p>
            </div>

        </div>

        <div class="section">

            <h3>📦 Produk yang Dibeli</h3>

            ${order.items.map(item => `

                <div class="cart-item">

                    <img src="${item.image}">

                    <div class="cart-info">

                        <b>${item.name}</b>

                        <p>${rupiah(item.price)}</p>

                    </div>

                </div>

            `).join("")}

        </div>

    `;
}


/* NAVIGASI */
function showPage(page, button = null) {

    const sections = [
        "produk",
        "admin",
        "keranjang",
        "checkoutPage",
        "pesanan"
    ];

    sections.forEach(id => {

        document.getElementById(id)
        .classList.add("hidden");

    });

    document.getElementById(page)
    .classList.remove("hidden");

    if (button) {

        document.querySelectorAll("nav button")
        .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

    }

    if (page === "keranjang") {
        updateCart();
    }

    if (page === "pesanan") {
        tampilkanPesanan();
    }
}


/* TAMBAH PRODUK DARI ADMIN */
function tambahProduk() {

    const nama = document.getElementById("namaProduk").value;
    const desc = document.getElementById("deskripsiProduk").value;
    const image = document.getElementById("gambarProduk").value;

    if (!nama || !desc || !image) {

        alert("Semua data produk harus diisi!");

        return;
    }

    const hargaText = desc.match(/\d[\d.]*/);

    let harga = 5000000;

    if (hargaText) {

        harga =
            parseInt(
                hargaText[0].replace(/\./g, "")
            );

    }

    products.push({

        id: Date.now(),

        name: nama,

        price: harga,

        desc: desc,

        image: image

    });

    renderProducts();

    document.getElementById("namaProduk").value = "";
    document.getElementById("deskripsiProduk").value = "";
    document.getElementById("gambarProduk").value = "";

    alert("✅ Produk berhasil ditambahkan!");

    showPage("produk");
}


/* JALANKAN */
renderProducts();
updateCart();

</script>

</body>
</html>
