<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetStore Management System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3f8;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#075cff,#1736a8);
    color:white;
    padding:25px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 4px 15px #0003;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:7px;
}

button{
    cursor:pointer;
}

.cart-btn{
    border:0;
    background:white;
    color:#075cff;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

main{
    width:94%;
    max-width:1200px;
    margin:25px auto;
}

.panel{
    background:white;
    padding:25px;
    margin-bottom:25px;
    border-radius:18px;
    box-shadow:0 5px 25px #0001;
}

.panel h2{
    color:#123b9c;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccd5e2;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-weight:bold;
}

.primary{
    background:#075cff;
    color:white;
}

.success{
    background:#12a05c;
    color:white;
}

.danger{
    background:#e53935;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    border:1px solid #e1e7ef;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px #0001;
}

.card img{
    width:100%;
    height:210px;
    object-fit:cover;
}

.card-body{
    padding:16px;
}

.card h3{
    margin-bottom:7px;
}

.price{
    color:#075cff;
    font-weight:bold;
    font-size:20px;
    margin:8px 0;
}

.desc{
    color:#667085;
    font-size:14px;
    line-height:1.5;
    min-height:60px;
}

video{
    width:100%;
    height:170px;
    margin-top:12px;
    border-radius:10px;
    background:#111;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.actions a{
    text-decoration:none;
    text-align:center;
}

.cart-item{
    background:#f5f8fc;
    padding:13px;
    margin-bottom:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:0;
    background:#dbe6ff;
    padding:6px 10px;
    border-radius:7px;
}

.total{
    text-align:right;
    font-size:20px;
    font-weight:bold;
    margin:18px 0;
}

.order{
    background:#f7faff;
    border-left:5px solid #075cff;
    padding:16px;
    border-radius:10px;
    margin-bottom:15px;
}

.status{
    display:inline-block;
    background:#fff0c2;
    color:#805900;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin:7px 0;
}

.hidden{
    display:none;
}

.empty{
    text-align:center;
    color:#667085;
    padding:20px;
}

@media(max-width:700px){
    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    header h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>

<div>
<h1>🛒 GadgetStore Management System</h1>
<p>E-Commerce GadgetStore Pro</p>
</div>

<button class="cart-btn" onclick="showCart()">
🛍️ Keranjang (<span id="cartCount">0</span>)
</button>

</header>


<main>

<!-- ================= ADMIN ================= -->

<section class="panel">

<h2>👨‍💼 Panel Administrator</h2>

<div class="form-grid">

<input id="pName"
placeholder="Nama Produk">

<input id="pPrice"
type="number"
placeholder="Harga Produk">

<textarea
id="pDesc"
class="full"
placeholder="Deskripsi & spesifikasi produk">
</textarea>

<input
id="pImage"
class="full"
placeholder="URL Gambar Produk">

<input
id="pVideo"
class="full"
placeholder="URL Video MP4">

<button
class="btn primary full"
onclick="addProduct()">

💾 Simpan Produk ke Database

</button>

</div>

</section>


<!-- ================= PRODUK ================= -->

<section class="panel">

<h2>🛍️ Panel Pembeli — Katalog Produk</h2>

<div id="products" class="products"></div>

</section>


<!-- ================= KERANJANG ================= -->

<section
id="cartPanel"
class="panel hidden">

<h2>🛒 Keranjang Belanja</h2>

<div id="cartList"></div>

<div class="total">
Total:
<span id="cartTotal">Rp 0</span>
</div>

<button
class="btn success"
onclick="checkout()">

💳 Checkout

</button>

</section>


<!-- ================= CHECKOUT ================= -->

<section
id="checkoutPanel"
class="panel hidden">

<h2>💳 Checkout & Pembayaran</h2>

<div class="form-grid">

<input
id="buyerName"
placeholder="Nama Pembeli">

<input
id="buyerPhone"
placeholder="Nomor HP">

<textarea
id="address"
class="full"
placeholder="Alamat lengkap pengiriman">
</textarea>

<select id="payment" class="full">

<option value="">
-- Pilih Metode Pembayaran --
</option>

<option>
Transfer Bank - BCA
</option>

<option>
Transfer Bank - BRI
</option>

<option>
Transfer Bank - BNI
</option>

<option>
QRIS
</option>

<option>
DANA
</option>

<option>
OVO
</option>

<option>
GoPay
</option>

<option>
COD (Bayar di Tempat)
</option>

</select>

<button
class="btn primary full"
onclick="placeOrder()">

✅ Buat Pesanan

</button>

</div>

</section>


<!-- ================= STATUS ================= -->

<section class="panel">

<h2>📦 Status Pesanan</h2>

<div id="orders"></div>

</section>

</main>


<script>

/* ================= DATA PRODUK ================= */

const defaultProducts = [

{
id:1,
name:"Smartphone Premium",
price:12000000,
desc:"Layar AMOLED 120Hz, RAM 12GB, kamera 50MP dan baterai besar.",
img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=85",
video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
},

{
id:2,
name:"Laptop Ultra",
price:18500000,
desc:"Laptop performa tinggi, RAM 16GB, SSD 1TB untuk sekolah dan kerja.",
img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=85",
video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
},

{
id:3,
name:"Smartwatch Pro",
price:3500000,
desc:"Smartwatch dengan fitur kesehatan, notifikasi dan baterai tahan lama.",
img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85",
video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
},

{
id:4,
name:"Wireless Headphone",
price:2200000,
desc:"Headphone Bluetooth dengan suara jernih dan desain nyaman.",
img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=85",
video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
}

];


/* ================= LOCAL STORAGE ================= */

let products =
JSON.parse(localStorage.getItem("products")) ||
defaultProducts;

let cart =
JSON.parse(localStorage.getItem("cart")) ||
[];

let orders =
JSON.parse(localStorage.getItem("orders")) ||
[];

let checkoutItems=[];


/* ================= FORMAT HARGA ================= */

function rupiah(number){

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(number);

}


/* ================= SIMPAN DATA ================= */

function saveData(){

localStorage.setItem(
"products",
JSON.stringify(products)
);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

}


/* ================= TAMPIL PRODUK ================= */

function renderProducts(){

const box =
document.getElementById("products");

box.innerHTML="";

products.forEach(p=>{

box.innerHTML += `

<div class="card">

<img
src="${p.img}"
alt="${p.name}"
onerror="
this.src='https://placehold.co/900x500?text=GadgetStore'
">

<div class="card-body">

<h3>
${p.name}
</h3>

<div class="price">
${rupiah(p.price)}
</div>

<p class="desc">
${p.desc}
</p>


<!-- VIDEO PRODUK -->

<video
controls
preload="metadata"
poster="${p.img}">

<source
src="${p.video}"
type="video/mp4">

Browser Anda tidak mendukung video.

</video>


<div class="actions">

<button
class="btn primary"
onclick="addCart(${p.id})">

🛒 Keranjang

</button>


<a
href="#checkoutPanel"
class="btn success"
onclick="buyNow(${p.id})">

⚡ Beli Sekarang

</a>

</div>

</div>

</div>

`;

});

updateCartCount();

}


/* ================= TAMBAH KERANJANG ================= */

function addCart(id){

let item =
cart.find(x=>x.id===id);

if(item){

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

saveData();

updateCartCount();

alert(
"Produk berhasil masuk ke keranjang!"
);

}


/* ================= JUMLAH KERANJANG ================= */

function updateCartCount(){

let total =
cart.reduce(
(sum,item)=>sum+item.qty,
0
);

document.getElementById(
"cartCount"
).textContent=total;

}


/* ================= TAMPIL KERANJANG ================= */

function showCart(){

document
.getElementById("cartPanel")
.classList
.remove("hidden");

renderCart();

document
.getElementById("cartPanel")
.scrollIntoView({
behavior:"smooth"
});

}


/* ================= RENDER KERANJANG ================= */

function renderCart(){

const list =
document.getElementById("cartList");

if(cart.length===0){

list.innerHTML=
`
<div class="empty">
Keranjang masih kosong.
</div>
`;

document.getElementById(
"cartTotal"
).textContent=rupiah(0);

return;

}


let total=0;

list.innerHTML="";


cart.forEach(item=>{

let p =
products.find(x=>x.id===item.id);

if(!p) return;

total +=
p.price * item.qty;


list.innerHTML += `

<div class="cart-item">

<div>

<b>${p.name}</b>

<br>

${rupiah(p.price)}

× ${item.qty}

</div>


<div class="qty">

<button
onclick="changeQty(${p.id},-1)">
−
</button>

<b>
${item.qty}
</b>

<button
onclick="changeQty(${p.id},1)">
+
</button>

<button
class="btn danger"
onclick="removeCart(${p.id})">

🗑️

</button>

</div>

</div>

`;

});


document.getElementById(
"cartTotal"
).textContent=rupiah(total);

}


/* ================= UBAH JUMLAH ================= */

function changeQty(id,value){

let item =
cart.find(x=>x.id===id);

if(!item)return;

item.qty += value;

if(item.qty<=0){

cart =
cart.filter(x=>x.id!==id);

}

saveData();

renderCart();

updateCartCount();

}


/* ================= HAPUS ================= */

function removeCart(id){

cart =
cart.filter(x=>x.id!==id);

saveData();

renderCart();

updateCartCount();

}


/* ================= BELI SEKARANG ================= */

function buyNow(id){

let p =
products.find(x=>x.id===id);

checkoutItems=[
{
id:p.id,
qty:1
}
];

document
.getElementById("checkoutPanel")
.classList
.remove("hidden");

document
.getElementById("checkoutPanel")
.scrollIntoView({
behavior:"smooth"
});

}


/* ================= CHECKOUT ================= */

function checkout(){

if(cart.length===0){

alert(
"Keranjang masih kosong!"
);

return;

}

checkoutItems =
[...cart];

document
.getElementById("checkoutPanel")
.classList
.remove("hidden");

document
.getElementById("checkoutPanel")
.scrollIntoView({
behavior:"smooth"
});

}


/* ================= BUAT PESANAN ================= */

function placeOrder(){

let name =
document.getElementById(
"buyerName"
).value.trim();

let phone =
document.getElementById(
"buyerPhone"
).value.trim();

let address =
document.getElementById(
"address"
).value.trim();

let payment =
document.getElementById(
"payment"
).value;


if(
!name ||
!phone ||
!address ||
!payment ||
checkoutItems.length===0
){

alert(
"Lengkapi semua data terlebih dahulu!"
);

return;

}


let total=0;

let items=[];


checkoutItems.forEach(item=>{

let p =
products.find(x=>x.id===item.id);

total +=
p.price * item.qty;

items.push({

name:p.name,

price:p.price,

qty:item.qty

});

});


let order={

id:"GS"+Date.now(),

name:name,

phone:phone,

address:address,

payment:payment,

items:items,

total:total,

status:"Menunggu diproses",

date:new Date()
.toLocaleString("id-ID")

};


orders.unshift(order);


/* Hapus isi keranjang */

cart=[];

checkoutItems=[];

saveData();

renderCart();

renderOrders();

updateCartCount();


/* Reset form */

document.getElementById(
"buyerName"
).value="";

document.getElementById(
"buyerPhone"
).value="";

document.getElementById(
"address"
).value="";

document.getElementById(
"payment"
).value="";


document
.getElementById("checkoutPanel")
.classList
.add("hidden");


alert(
"Pesanan berhasil dibuat! 📦"
);

}


/* ================= STATUS PESANAN ================= */

function renderOrders(){

const box =
document.getElementById("orders");


if(orders.length===0){

box.innerHTML=
`
<div class="empty">
Belum ada pesanan.
</div>
`;

return;

}


box.innerHTML="";


orders.forEach(
(order,index)=>{

box.innerHTML += `

<div class="order">

<b>
Pesanan #${order.id}
</b>

<br>

<span class="status">
${order.status}
</span>

<p>
<b>Pembeli:</b>
${order.name}
</p>

<p>
<b>No HP:</b>
${order.phone}
</p>

<p>
<b>Alamat:</b>
${order.address}
</p>

<p>
<b>Pembayaran:</b>
${order.payment}
</p>

<p>
<b>Produk:</b>

${order.items
.map(
i=>`${i.name} (${i.qty}x)`
)
.join(", ")}

</p>

<p>
<b>Total:</b>
${rupiah(order.total)}
</p>

<br>


<button
class="btn"
onclick="setStatus(${index},'Menunggu diproses')">

Menunggu

</button>


<button
class="btn"
onclick="setStatus(${index},'Dikemas')">

Dikemas

</button>


<button
class="btn"
onclick="setStatus(${index},'Dikirim')">

Dikirim

</button>


<button
class="btn success"
onclick="setStatus(${index},'Sampai di alamat')">

Sampai di alamat

</button>

</div>

`;

});

}


/* ================= UPDATE STATUS ================= */

function setStatus(index,status){

orders[index].status=status;

saveData();

renderOrders();

if(
status==="Sampai di alamat"
){

alert(
"🎉 Pesanan sudah sampai di alamat!"
);

}

}


/* ================= TAMBAH PRODUK ADMIN ================= */

function addProduct(){

let name =
document.getElementById(
"pName"
).value.trim();

let price =
Number(
document.getElementById(
"pPrice"
).value
);

let desc =
document.getElementById(
"pDesc"
).value.trim();

let img =
document.getElementById(
"pImage"
).value.trim();

let video =
document.getElementById(
"pVideo"
).value.trim();


if(
!name ||
!price ||
!desc
){

alert(
"Nama, harga dan deskripsi wajib diisi!"
);

return;

}


products.unshift({

id:Date.now(),

name:name,

price:price,

desc:desc,

img:
img ||
"https://placehold.co/900x500?text=Gadget+Baru",

video:
video ||
"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"

});


saveData();

renderProducts();


document.getElementById(
"pName"
).value="";

document.getElementById(
"pPrice"
).value="";

document.getElementById(
"pDesc"
).value="";

document.getElementById(
"pImage"
).value="";

document.getElementById(
"pVideo"
).value="";


alert(
"✅ Produk berhasil ditambahkan!"
);

}


/* ================= JALANKAN ================= */

renderProducts();

renderOrders();

</script>

</body>
</html>
